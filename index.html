<!DOCTYPE html>
<html lang="en">
<head>
<title>LetsJom | Coming Soon | Official Website</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background: radial-gradient(circle at 50% 50%, #0f0f1a, #050507);
color:#00fff0;
font-family:'Orbitron',sans-serif;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:1rem;
}

h1{
font-size:clamp(2rem,5vw,4rem);
text-shadow:0 0 15px #00fff0,0 0 30px #0077ff;
margin-bottom:1rem;
animation:flicker 3s infinite;
}

p{
color:#ccc;
margin-bottom:2rem;
}

/* Countdown */

#countdown{
display:flex;
gap:1rem;
flex-wrap:wrap;
justify-content:center;
}

.time-box{
background:rgba(0,255,240,0.1);
border:1px solid #00fff0;
border-radius:12px;
padding:1rem;
min-width:80px;
box-shadow:0 0 10px #00fff0 inset;
}

.time-box span{
display:block;
font-size:2rem;
}

/* TV Section */

.tv-section{
margin-top:2rem;
display:flex;
flex-direction:column;
align-items:center;
}

.tv-title{
margin-bottom:1rem;
font-size:1.2rem;
text-shadow:0 0 12px #00fff0;
}

/* Channel Buttons */

.channel-buttons{
display:flex;
flex-wrap:wrap;
gap:0.5rem;
justify-content:center;
margin-bottom:1rem;
}

.channel-buttons button{
background:rgba(0,255,240,0.1);
border:1px solid #00fff0;
color:#00fff0;
padding:0.5rem 1rem;
border-radius:8px;
cursor:pointer;
font-family:'Orbitron';
transition:0.3s;
}

.channel-buttons button:hover{
background:#00fff0;
color:black;
}

/* Player */

.player-wrapper{
position:relative;
width:420px;
max-width:95vw;
aspect-ratio:16/9;
border:1px solid #00fff0;
border-radius:12px;
box-shadow:0 0 15px #00fff0;
overflow:hidden;
background:black;
}

.player-wrapper iframe{
width:100%;
height:100%;
border:none;
}

footer{
margin-top:2rem;
font-size:0.8rem;
color:#777;
}

@keyframes flicker{
0%,19%,21%,23%,25%,54%,56%,100%{opacity:1;}
20%,24%,55%{opacity:0.4;}
}

</style>
</head>

<body>

<h1>COMING SOON</h1>
<p>Our next-gen website will go live on <strong>31 August 2026</strong></p>

<!-- Countdown -->
<div id="countdown">
<div class="time-box"><span id="days">00</span>Days</div>
<div class="time-box"><span id="hours">00</span>Hours</div>
<div class="time-box"><span id="minutes">00</span>Minutes</div>
<div class="time-box"><span id="seconds">00</span>Seconds</div>
</div>

<!-- TV HUB -->
<div class="tv-section">

<div class="tv-title">📺 RTM Malaysia Live TV</div>

<div class="channel-buttons">

<button onclick="changeChannel('LIVE1')">LIVE1</button>
<button onclick="changeChannel('LIVE2')">LIVE2</button>
<button onclick="changeChannel('LIVE3')">LIVE3</button>
<button onclick="changeChannel('LIVE4')">LIVE4</button>
<button onclick="changeChannel('LIVE5')">LIVE5</button>

</div>

<div class="player-wrapper">
<iframe id="tvPlayer"
allow="autoplay; fullscreen"
allowfullscreen
src="https://www.youtube.com/embed/1hJvA0hV3J0">
</iframe>
</div>

</div>

<footer>© <span id="year"></span> LetsJom</footer>

<script>

/* Countdown */
function countdown(){
const launch=new Date("Aug 31 2026 00:00:00").getTime();
const now=new Date().getTime();
const gap=launch-now;

const s=1000;
const m=s*60;
const h=m*60;
const d=h*24;

document.getElementById("days").innerText=Math.floor(gap/d);
document.getElementById("hours").innerText=Math.floor((gap%d)/h);
document.getElementById("minutes").innerText=Math.floor((gap%h)/m);
document.getElementById("seconds").innerText=Math.floor((gap%m)/s);
}

setInterval(countdown,1000);
countdown();

/* Year */
document.getElementById("year").innerText=new Date().getFullYear();

/* Channel Switch */

function changeChannel(channel){

const streams={
LIVE1:"https://www.youtube.com/watch?v=jfKfPfyJRdk",
LIVE2:"https://www.youtube.com/watch?v=vYIYIVmOo3Q,
LIVE3:"https://www.youtube.com/watch?v=QUCQNAx28Jo&list=RDQUCQNAx28Jo&start_radio=1,
LIVE4:"https://www.youtube.com/watch?v=6DjNJ33ZgzQ"
LIVE5:"https://www.youtube.com/watch?v=daqB3i9WYIY"
};

document.getElementById("tvPlayer").src=streams[channel];

}

</script>

</body>
</html>
